[project]
name = "ocrs-models"
version = "0.1.0"
description = "PyTorch models for the Ocrs OCR engine"
authors = [{ name = "Robert Knight", email = "robertknight@gmail.com" }]
license = "MIT OR Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26.3,<2",
    "pillow>=10.3.0,<11",
    "tqdm>=4.66.1,<5",
    "opencv-python>=4.9.0.80,<5",
    "shapely>=2.0.2,<3",
    "wandb>=0.16.2,<0.17",
    "pylev>=1.4.0,<2",
    "onnx>=1.16.0,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.8.0,<2",
    "types-Pillow>=10.2.0.20240125,<11",
    "ruff>=0.2.1,<0.3",
]
